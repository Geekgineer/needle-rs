[workspace]
members = [
    "crates/needle-core",
    "crates/needle-infer",
    "crates/needle-c",
    "crates/needle-wasm",
    "crates/needle-cli",
    "crates/needle-python",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Abdalrahman Ibrahim"]
license = "MIT"
repository = "https://github.com/geekgineer/needle-rs"
homepage = "https://github.com/geekgineer/needle-rs"
documentation = "https://docs.rs/needle-infer"
readme = "README.md"
# Set by `usize::is_multiple_of`, stabilised in 1.87. Verified with
# `cargo +1.87 check --workspace --all-targets`.
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
