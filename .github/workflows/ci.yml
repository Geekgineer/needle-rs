name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude needle-python --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude needle-wasm --exclude needle-python

  test-aarch64:
    name: test (linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build (aarch64)
        run: cargo build --release --target aarch64-unknown-linux-gnu --workspace --exclude needle-wasm --exclude needle-python
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  wasm:
    name: wasm-pack build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.12.1 --locked
      # npm binaryen ships v120+ with all required flags; apt ships v108 (too old).
      - name: Install binaryen
        run: npm install -g binaryen
      - name: Build WASM (nodejs target — required by node_e2e.js CommonJS tests)
        run: wasm-pack build crates/needle-wasm --target nodejs --release --out-dir ../../pkg-nodejs/
      - name: Optimise WASM
        run: |
          wasm-opt pkg-nodejs/needle_wasm_bg.wasm -Oz \
            --enable-bulk-memory --enable-bulk-memory-opt --enable-mutable-globals \
            --enable-sign-ext --enable-nontrapping-float-to-int \
            -o pkg-nodejs/needle_wasm_bg.wasm
          echo "WASM size after wasm-opt: $(wc -c < pkg-nodejs/needle_wasm_bg.wasm) bytes"
      - name: Run WASM Node.js tests (no weights — smoke only)
        run: node crates/needle-wasm/tests/node_e2e.js --no-weights || true
        # Full parity tests require weights; see the parity job below.

  # ── Parity tests ────────────────────────────────────────────────────────
  parity:
    name: parity tests (with weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download weights from HuggingFace
        run: |
          pip install -q huggingface_hub
          hf download Abdalrahman/needle-rs-safetensors \
            needle.safetensors vocab.txt --local-dir weights/

      - name: Run parity tests
        run: |
          cargo test -p needle-infer --test e2e_parity -- --nocapture
          cargo test -p needle-infer --test real_parity -- --nocapture

  parity-v2:
    name: v2 parity tests (needle2.cact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Public repo, no auth needed. 13.7 MB.
      - name: Download the v2 checkpoint from HuggingFace
        run: |
          pip install -q huggingface_hub
          hf download Cactus-Compute/needle2 needle2.cact --local-dir weights/

      # Container and tokenizer fixtures are tracked, so these need no JAX.
      # The forward-pass ladder (tests/v2_forward_vectors.*) is gitignored for
      # size and regenerated locally with tools/gen_v2_forward_parity.py; that
      # test skips cleanly here. See docs/v2-port-record.md.
      # These run on x86_64, so they also exercise the AVX2 dispatch path in
      # needle-core::cq against the scalar reference — the only place that path
      # is verified, since development happens on aarch64.
      - name: Run v2 parity tests
        run: |
          cargo test -p needle-infer --release --test cact_parity -- --nocapture
          cargo test -p needle-infer --release --test tokenizer_v2_parity -- --nocapture
          cargo test -p needle-infer --release --test v2_batch_parity -- --nocapture
          cargo test -p needle-infer --release --test v2_heads_parity -- --nocapture
          cargo test -p needle-infer --release --test v2_e2e_parity -- --nocapture
          # Same suites with threading on: row splitting must stay bit-identical.
          cargo test -p needle-infer --release --features parallel \
            --test v2_e2e_parity --test v2_batch_parity -- --nocapture
          cargo test -p needle-infer --release --test v2_constrained -- --nocapture
          cargo test -p needle-c      --release --test v2_ffi_smoke -- --nocapture

      # The browser demo calls exactly these bindings, so a break shows up here
      # rather than in a deployed page.
      - name: Verify the v2 WASM bindings
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          wasm-pack build crates/needle-wasm --target nodejs --release --out-dir ../../pkg-nodejs/
          node crates/needle-wasm/tests/node_e2e_v2.js

      - name: Smoke-test the CLI against the v2 checkpoint
        run: |
          cargo run --release -p needle-rs-cli -- --json --max-tokens 32 \
            weights/needle2.cact "What's the weather in Paris?" \
            '[{"name":"get_weather","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}]'

  parity-v3:
    name: v3 parity tests (needle3.cact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Public repo, no auth needed. 35.3 MB container + its tokenizer.
      - name: Download the v3 checkpoint from HuggingFace
        run: |
          pip install -q huggingface_hub
          hf download Cactus-Compute/needle3 needle3.cact --local-dir weights/

      # Container and tokenizer fixtures are tracked, so these need no JAX.
      # They run on x86_64, so they also exercise the AVX2 dispatch in
      # needle-core::cq against the scalar reference — the only place that
      # path is verified, since development happens on aarch64.
      - name: Run v3 parity tests
        run: |
          cargo test -p needle-infer --release --test cact_v3_parity -- --nocapture
          cargo test -p needle-infer --release --test tokenizer_v3_parity -- --nocapture
          # The forward/decode ladder is gitignored for size, so its test skips
          # cleanly here; these run against the container alone.
          cargo test -p needle-infer --release --test v3_e2e -- --nocapture
          cargo test -p needle-c      --release --test v3_ffi_smoke -- --nocapture
          # The KV-quantisation vectors are tracked, so this needs no JAX and
          # no container: it pins the quantiser against upstream's fake_quant
          # and the hoisted-scale reader against a dequantised buffer.
          cargo test -p needle-core   --release --test v3_kv_quant_parity -- --nocapture
          # These two need the container only. The int8 suite is what proves
          # the quantised cache saves the memory it claims and that batched
          # prefill and stepped decode stay bit-identical under it.
          cargo test -p needle-infer  --release --test v3_kv_int8 -- --nocapture
          cargo test -p needle-infer  --release --test v3_statelessness -- --nocapture
          # Same suites threaded: row splitting must stay bit-identical. The
          # int8 suite is included because its prefill-vs-decode assertion is
          # exact equality, which is precisely what a threading bug breaks.
          cargo test -p needle-infer --release --features parallel --test v3_e2e -- --nocapture
          cargo test -p needle-infer --release --features parallel --test v3_kv_int8 -- --nocapture

      # The browser demo calls exactly these bindings, so a break shows up here
      # rather than in a deployed page.
      - name: Verify the v3 WASM bindings
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          wasm-pack build crates/needle-wasm --target nodejs --release --out-dir ../../pkg-nodejs/
          node crates/needle-wasm/tests/node_e2e_v3.js

      - name: Compile the C header against the built library
        run: |
          cargo build -p needle-c --release
          cc -I crates/needle-c/include examples/c/v3_smoke.c \
             -L target/release -lneedle_c -o /tmp/v3_smoke
          LD_LIBRARY_PATH=target/release /tmp/v3_smoke

      - name: Smoke-test the CLI against the v3 checkpoint
        run: |
          cargo run --release -p needle-rs-cli -- --json --constrain \
            weights/needle3.cact "What's the weather in Paris?" \
            '[{"name":"get_weather","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}]'
