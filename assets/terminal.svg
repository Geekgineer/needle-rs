<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img"
     aria-label="A needle-rs terminal session: Needle v3 reasoning before a tool call, the same query with the int8 cache, then Needle v2 and v1 from the same binary">
  <defs>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="500" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="500" fill="#0D1117"/>
    <rect width="1200" height="40" fill="url(#titlebar)"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="20" r="6" fill="#28C840"/>
    <text x="600" y="25" text-anchor="middle"
          font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="12" fill="#7D8590">needle-rs — local tool calling, no server</text>
  </g>
  <rect width="1200" height="500" rx="12" fill="none" stroke="#21262D" stroke-width="1"/>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <!-- Needle v3: one file -->
    <text x="28" y="76" fill="#6E7681">
      <tspan fill="#7EE787">$</tspan> hf download Cactus-Compute/needle3 needle3.cact <tspan fill="#6E7681">--local-dir weights/</tspan>
    </text>
    <text x="28" y="100" fill="#7D8590">needle3.cact  35.3 MB   <tspan fill="#6E7681">weights + geometry + tokenizer, one file</tspan></text>

    <!-- v3 reasons before it answers -->
    <text x="28" y="140" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs weights/needle3.cact "What's the weather in Paris?" <tspan fill="#6E7681">"$TOOLS"</tspan>
    </text>
    <text x="28" y="164" fill="#6E7681">&#60;think&#62;</text>
    <text x="28" y="186" fill="#A5A5A5">Query asks for weather in Paris. get_weather tool with city 'Paris'.</text>
    <text x="28" y="208" fill="#6E7681">&#60;/think&#62;</text>
    <text x="28" y="230" fill="#7EE787">&#60;tool_call&#62;[{"name":"get_weather","arguments":{"city":"Paris"}}]&#60;/tool_call&#62;</text>

    <!-- int8 cache -->
    <text x="28" y="270" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs <tspan fill="#E8633F">--json --kv-int8</tspan> weights/needle3.cact \
    </text>
    <text x="52" y="292" fill="#C9D1D9">"Email alice@example.com saying the build is green" <tspan fill="#6E7681">"$TOOLS"</tspan></text>
    <text x="28" y="316" fill="#7EE787">[{"name":"send_email","arguments":{"to":"alice@example.com",</text>
    <text x="28" y="336" fill="#7EE787">  "subject":"build is green","body":"the build is green"}}]</text>

    <!-- v2 and v1: same binary -->
    <text x="28" y="378" fill="#6E7681">
      <tspan fill="#6E7681">#</tspan> Needle v2 and v1 work too — same binary, the container states its generation
    </text>
    <text x="28" y="402" fill="#C9D1D9">
      <tspan fill="#7EE787">$</tspan> needle-rs <tspan fill="#E8633F">--json</tspan> weights/needle2.cact "$Q" "$TOOLS"
    </text>
    <text x="28" y="426" fill="#7EE787">[{"name":"get_weather","arguments":{"city":"Paris"}}]</text>
  </g>

  <!-- Footer facts -->
  <line x1="28" y1="446" x2="1172" y2="446" stroke="#21262D" stroke-width="1"/>
  <!-- One flowing text element rather than hand-placed items: renderers
       substitute monospace fonts of very different widths, and fixed x
       positions overflow the viewBox on the wide ones. -->
  <text x="28" y="470" font-family="ui-monospace, monospace" font-size="12" fill="#6E7681">v3: 10 ms load &#183; 8.7 ms/token decode &#183; 2.3 MB cache at int8 &#183; 0 runtime dependencies</text>
  <text x="28" y="490" font-family="ui-monospace, monospace" font-size="11" fill="#484F58">
    Apple M5 Max, steady state. Output is a real session; see BENCHMARKS.md for method.
  </text>
</svg>
