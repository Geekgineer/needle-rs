[package]
name = "needle-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C ABI shared library for Needle (FFI for C, Go, Swift, Python ctypes)"
keywords = ["ffi", "llm", "inference", "tool-calling", "c-api"]
categories = ["external-ffi-bindings", "science"]
readme = "../../README.md"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
needle-infer = { path = "../needle-infer", version = "0.3.1", features = ["parallel"] }
needle-core = { path = "../needle-core", version = "0.3.1", features = ["std"] }
