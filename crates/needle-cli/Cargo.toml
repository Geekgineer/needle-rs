[package]
# Published as `needle-rs-cli`: the crates.io name `needle-cli` belongs to an
# unrelated project (a GitHub PR TUI), and `needle-rs` to another. The installed
# binary is still `needle-rs` — see [[bin]] below.
name = "needle-rs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Needle command-line inference: local AI tool calling with no server and no API key"
keywords = ["llm", "inference", "tool-calling", "cli", "local"]
categories = ["command-line-utilities", "science"]
readme = "../../README.md"
rust-version.workspace = true

[[bin]]
name = "needle-rs"
path = "src/main.rs"

[dependencies]
needle-infer = { path = "../needle-infer", version = "0.3.1", features = ["parallel"] }
needle-core = { path = "../needle-core", version = "0.3.1", features = ["std"] }
